[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cidia-gateway"
version = "0.1.0"
description = "Servicio CidIA: API de la app, API compatible con OpenAI y servidor MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "pg8000>=1.31",
  "pgvector>=0.3.6",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "mcp>=2.3,<3",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cidia*"]

[tool.setuptools.package-data]
"cidia.semilla_datos" = ["audio/*.ogg", "*.md", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
